<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PhishShield Security Console</title>

<style>
body {
    font-family: Aptos,sans-serif;
    background: #0b1220;
    color: #e5e7eb;
    margin: 3;
    padding: 0;
}
.container {
    width: 80%;
    max-width: 1500px;
    margin: auto;
}
.topbar {
    background: #111a2e;
    border-bottom: 1px solid #23314f;
    padding: 15px 20px;
    margin-bottom: 20px;
    font-size: 22px;
    font-weight: 700;
    text-align: center; 
    display: flex;
    align-items: center;
    gap: 6px;
} 
.topbar{
    background:#111a2e;
    border-bottom:1px solid #23314f;
    padding:15px 20px;
    margin-bottom:20px;

    display:flex;
    align-items:center;
    gap:12px;
}
.topbar-text{
    display:flex;
    flex-direction:column;
}
.topbar h2 {
    margin: 0;
    color: #e5e7eb;
}
.topbar p {
    margin: 5px 0 0;
    color: #e5e7eb;
    font-size: 13px;
}
.card {
    background: #111827;
    padding: 20px;
    margin-top: 20px;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0,0,0,0.3);
}
.card h2 {
    margin-top: 0;
    color: #e5e7eb;
    border-bottom: 1px solid #23314f;
    padding-bottom: 10px;
    font-size: 15px;
    font-weight: 600;
}
.card h3{
    font-size:16px;
    font-weight:600;
    color:#e5e7eb;
}
.input-bar {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 20px;
    padding: 10px;
}
input {
    width: 60%;
    padding: 12px;
    border-radius: 6px;
    border: 1px solid #23314f;
    background: #111a2e;
    color: #e5e7eb;
}
button{
    padding:12px 20px;
    border:none;
    border-radius:10px;

    background:linear-gradient(
        135deg,
        #3b82f6,
        #2563eb
    );

    color:white;
    font-weight:600;
    cursor:pointer;

    box-shadow:
        0 4px 12px rgba(37,99,235,.35);

    transition:.25s ease;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:
        0 8px 20px rgba(37,99,235,.45);
}

button:active{
    transform:translateY(0);
}
.gauge-wrapper {
    display: flex;
    justify-content: center;
    margin: 20px 0;
}
.gauge {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    background: conic-gradient(
        var(--c) calc(var(--p) * 1%),
        #1f2a44 0
    );
    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow:
        0 0 10px rgba(0,0,0,0.4),
        0 0 25px var(--c),
        0 0 60px rgba(59,130,246,0.25);

    transition: 0.5s ease;
    animation: pulseGlow 2.5s infinite ease-in-out;
}

.gauge-inner {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: #111a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.gauge-value {
    font-size: 28px;
    font-weight: bold;
}

.gauge-label {
    font-size: 12px;
    color: #94a3b8;
}
.signal-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.signal {
    background: #0b1220;
    border: 1px solid #23314f;
    padding: 12px;
    border-radius: 8px;
}

.sig-title {
    font-size: 11px;
    opacity: 0.7;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.sig-value {
     font-size: 16px;
    font-weight: 700;
    margin-top: 6px;
    font-weight: bold;
    color: #e5e7eb;
}
.mini-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.mini-box {
    background: #0b1220;
    padding: 10px;
    border: 1px solid #23314f;
    border-radius: 8px;
    text-align: center;
}
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 20px;
    border :1px solid #23314f;
}
.section {
    background: #0f172a;
    padding: 15px;
    border-radius: 10px;
}
.section h3{
    color:#e5e7eb;
    font-size:14px;
    margin-bottom:12px;
}
.ai-analysis{
    margin-top:20px;
    background:#0f172a;
    padding:24px;
    border-radius:10px;
    line-height:1.9;
    font-size:15px;
}
.ai-analysis h3{
    margin-top:0;
    margin-bottom:12px;

    color:#dbeafe;

    font-size:16px;
}
.log-box {
    background: #0b1220;
    border: 1px solid #23314f;
    padding: 10px;
    border-radius: 8px;
}

.log-item {
    padding: 6px;
    border-bottom: 1px solid #23314f;
    font-size: 13px;
    color: #e5e7eb;
}
.empty {
    color: #e5e7eb;
    font-style: italic;
    padding: 10px;
}
.loader {
    width: 40px;
    height: 40px;
    border: 4px solid #23314f;
    border-top: 4px solid #21b2f4;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 20px auto;
}

@keyframes spin {
    100% { transform: rotate(360deg); }
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
@keyframes pulseGlow {
    0% {
        filter: brightness(1);
        transform: scale(1);
    }
    50% {
        filter: brightness(1.2);
        transform: scale(1.02);
    }
    100% {
        filter: brightness(1);
        transform: scale(1);
    }
}
.log-item:last-child {
    border-bottom: none;
}
.card {
    animation: fadeIn 0.4s ease;
}
</style>

</head>
<body>
<div class="topbar">

    <div class="topbar-text">
        <h2>🛡️PhishShield SOC Console</h2>
        <p>Real-time phishing detection.</p>
    </div>
</div>
<div class="container">
    <div class="card">
    <h3><b>Threat Detection Engine</b></h3>
    <p>
        Analyze URLs, emails, and messages using AI-powered phishing
        detection and threat intelligence analysis.
    </p>
</div>
<div class="input-bar">
    <input id="textInput" placeholder="Enter URL, email or message">
    <button onclick="analyze()">Analyze</button>
</div>
<div id="result"></div>
<script>
function getRiskState(score) { 
    if (score > 80) 
        return "CRITICAL";
    if (score > 60) 
        return "HIGH"; 
    if (score > 30) 
        return "MODERATE";
    return "LOW"; }

function loadingUI() {
    return `
    <div class="card">
        <div class="loader"></div>

        <h3 style="text-align:center;color:#dbeafe;">
            Running Security Analysis
        </h3>

        <p style="text-align:center;color:#94a3b8;">
           <i> Checking threat indicators, phishing patterns,
            and intelligence feeds...</i>
        </p>

    </div>`;
}

async function analyze() {
    try {
        const text = document.getElementById("textInput").value;

        document.getElementById("result").innerHTML = loadingUI();

        const response = await fetch("http://127.0.0.1:5000/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text })
        });

        const data = await response.json();

        if (data.error) {
            document.getElementById("result").innerHTML = `
            <div class="card">
                <h3 style="color:#f87171;">System Alert</h3>
                <details>
                    <summary>Technical details</summary>
                    <pre>${data.error}</pre>
                </details>
            </div>`;
            return;
        }

        const score = Math.max(0, Math.min(100, Number(data.score || 0)));

        let color = "#22c55e";
        if (data.risk === "HIGH") color = "#ef4444";
        else if (data.risk === "MEDIUM") color = "#f59e0b";

        const ti = data.threat_intelligence?.summary || [];
        const indicators = data.detection_indicators || [];
        const riskState = getRiskState(score);

        document.getElementById("result").innerHTML = `

        <div class="card">

            <h2>Security Analysis Report</h2>

            <!-- GAUGE -->
            <div class="gauge-wrapper">
                <div class="gauge" style="--p:${score}; --c:${color}">
                    <div class="gauge-inner">
                        <div class="gauge-value">${score}</div>
                        <div class="gauge-label">Threat Score</div>
                    </div>
                </div>
            </div>
            <div class="section">
    <h3>Attack Signal Matrix</h3>

    <div class="signal-grid">

        <div class="signal">
            <div class="sig-title">Credential Risk</div>
        <div><b>
        ${data.category === "credential_harvesting" ? "HIGH" : "LOW"} </b></div>
        </div>

        <div class="signal">
            <div class="sig-title">Link Risk</div>
            <div class="sig-value">${data.detection_indicators.length > 2 ? "HIGH" : "MEDIUM"}</div>
        </div>

        <div class="signal">
            <div class="sig-title">Message Behavioral</div>
            <div class="sig-value">${data.score > 50 ? "SUSPICIOUS" : "NORMAL"}</div>
        </div>

        <div class="signal">
            <div class="sig-title">Threat Severity</div>
            <div class="sig-value">${data.risk}</div>
        </div>

    </div>
</div>
            </div>

            <!-- MINI SUMMARY -->
            <div class="mini-grid">

                <div class="mini-box">
                    <h4>Risk Status</h4>
                    <div style="color:${color}; font-weight:bold;">
                        ${data.risk}
                    </div>
                </div>

                <div class="mini-box">
                <h4>Threat Category</h4>
                <div>${data.category.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase())}</div>
                    </div>
                
                    <div class="mini-box">
                <h4>Analysis Time</h4>
                <div>${new Date().toLocaleTimeString()}</div>
</div>
            </div>

            <!-- MAIN CONTENT -->
            <div class="grid">

                <div class="section">
                    <h3>Threat Intelligence</h3>
                    <div class="log-box">
                        ${
                            ti.length
                            ? ti.map(i => `<div class="log-item">${i}</div>`).join("")
                            : `<div class="empty">No malicious reputation records were found.</div>`
                        }
                    </div>
                </div>

                <div class="section">
                    <h3>Detection Indicators</h3>
                    <div class="log-box">
                        ${
                            indicators.length
                            ? indicators.map(i => `<div class="log-item">${i}</div>`).join("")
                            : `<div class="empty">No phishing indicators identified.</div>`
                        }
                    </div>
                </div>
            </div>
                   
            <div class="ai-analysis">
                    <h3>AI Security Analysis</h3>
                    <p style="line-height:1.6;">
                        ${data.ai_explanation}
                    </p>
                   </div>


            </div>

        </div>
        `;
    }
    catch (err) {
        document.getElementById("result").innerHTML = `
        <div class="card">
            <h3 style="color:#f87171;">System Failure</h3>
            <details>
                <summary>Error details</summary>
                <pre>${err}</pre>
            </details>
        </div>`;
    }
}
</script>
</body>
 </html>
